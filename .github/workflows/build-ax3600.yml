name: Build LibWrt AX3600 stock

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "源码基线：25.12-nss = 滚动分支(默认、SNAPSHOT、内核随分支更新)；v25.12.2 = 固定发布版(同源、内核6.12.103)"
        required: true
        type: choice
        options:
          - "25.12-nss"
          - "v25.12.2"
        default: "25.12-nss"

env:
  TZ: Asia/Shanghai

jobs:
  build:
    # 依赖清单含 libncurses5-dev 等 22.04 专用包，不能贸然切 24.04。
    # 注意：ubuntu-22.04 自 2026-09-17 起进入弃用期，2027-04-17 彻底移除，
    # 期间可能排队变慢；若该标签不可用，需同步改依赖清单后再切换。
    # 固件不编 OpenClash / ruby，编译量回到常规规模；350min 保留作余量。
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 取本仓库配置
        uses: actions/checkout@v5

      - name: 释放 runner 磁盘（OpenWrt 编译至少需 25GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup /usr/local/swift \
            /usr/lib/jvm /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 安装编译依赖（官方 README 清单，Ubuntu 22.04 专用）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev \
            libtool lrzsz genisoimage msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip libpython3-dev qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd zlib1g-dev zstd
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: 克隆 LibWrt 源码
        run: |
          git clone -b "${{ inputs.branch }}" --depth 1 --single-branch \
            https://github.com/LiBwrt/LibWrt.git "$GITHUB_WORKSPACE/libwrt"
          cd "$GITHUB_WORKSPACE/libwrt"
          git log -1 --format='COMMIT %H | %ci | %s'
          echo "=== 内核版本（随基线变化，不写死）==="
          grep -H 'LINUX_VERSION-6.12' target/linux/generic/kernel-6.12
          echo "=== 发行版本 / 官方软件源 ==="
          grep -E '^VERSION_(NUMBER|CODE|REPO):=' include/version.mk
          echo "=== feeds 是否锁定 commit（^sha = 固定发布基线）==="
          grep -E '^src-git' feeds.conf.default
          KV=$(sed -n 's/^LINUX_VERSION-6\.12 = //p' target/linux/generic/kernel-6.12)
          echo "本次基线: ${{ inputs.branch }} / 内核 6.12${KV}" >> "$GITHUB_STEP_SUMMARY"

      - name: 追加 Vantage + Passwall 源，更新并安装 feeds
        working-directory: libwrt
        run: |
          # Vantage 不在 LibWrt 的 feeds 里，但它支持当外部 feed 编译：
          # luci-theme-vantage/Makefile 会优先用 ../../luci.mk，没有则回落 $(TOPDIR)/feeds/luci/luci.mk。
          # 主题包自带 root/etc/uci-defaults/30_luci-theme-vantage，首次启动会注册
          # luci.themes.Vantage 并在"新注册"时把 luci.main.mediaurlbase 设为 /luci-static/vantage，
          # 所以不需要我们再写一个设置默认主题的脚本（也不会覆盖管理员后来手动改的主题）。
          if ! grep -q 'luci-theme-vantage' feeds.conf.default; then
            echo 'src-git vantage https://github.com/anothadev/luci-theme-vantage.git;main' >> feeds.conf.default
          fi
          # Passwall（v1）自 2026 起迁到 Openwrt-Passwall 组织；旧地址 xiaorouji/openwrt-passwall
          # 已 404。两个源分工：luci 侧是插件本体（Lua，架构无关，PKG_VERSION 26.11.11），
          # packages 侧提供 xray-core / sing-box / chinadns-ng / microsocks / tcping 等二进制。
          # 注意：passwall_packages 里的 smartdns / xray-core / sing-box 与官方 packages feed
          # 同名，feeds 后装的会覆盖先装的，这是已知现象，不影响编译。
          if ! grep -q 'passwall_packages' feeds.conf.default; then
            echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> feeds.conf.default
            echo 'src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main' >> feeds.conf.default
          fi
          echo "=== 本次生效的 feeds ==="
          grep -E '^src-git' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== Vantage / Passwall 包定义落位检查 ==="
          for p in luci-theme-vantage luci-app-vantage luci-app-passwall \
                   xray-core sing-box chinadns-ng microsocks tcping ipt2socks; do
            hit=$(find feeds package -maxdepth 6 -type d -name "$p" -print -quit 2>/dev/null)
            if [ -n "$hit" ]; then echo "OK   $p -> $hit"; else echo "::error::$p 未安装到 package/feeds，编不进固件"; exit 1; fi
          done

      - name: 核对固件必编包与后续可安装代理包（Passwall 已改为编进固件）
        working-directory: libwrt
        run: |
          echo "=== 固件必编包（缺一个就终止）==="
          miss=0
          for p in adguardhome smartdns luci-theme-vantage luci-app-vantage \
                   luci-app-adguardhome luci-app-smartdns luci-app-passwall; do
            hit=$(find feeds package -maxdepth 6 -type d -name "$p" -print -quit 2>/dev/null)
            if [ -n "$hit" ]; then echo "OK   $p -> $hit"; else echo "MISS $p"; miss=1; fi
          done
          [ "$miss" -eq 0 ] || { echo "::error::缺少上述包定义，请检查 feeds 分支后重试"; exit 1; }
          echo "=== Passwall 依赖清单（从 Makefile 实读，确认依赖都在源码树里）==="
          PW=$(find feeds package -maxdepth 6 -type d -name luci-app-passwall -print -quit 2>/dev/null)
          grep -E '^(PKG_VERSION|LUCI_DEPENDS)' -A2 "$PW/Makefile" 2>/dev/null || true
          echo "=== 后续 apk 可装包（只需源里有，不写进 .config）==="
          for p in sing-box luci-app-homeproxy luci-app-openclash luci-compat \
                   ruby-yaml unzip; do
            hit=$(find feeds package -maxdepth 6 -type d -name "$p" -print -quit 2>/dev/null)
            if [ -n "$hit" ]; then
              echo "OK   $p -> $hit"
              grep -E '^(PKG_VERSION|LUCI_DEPENDS|DEPENDS)' "$hit/Makefile" 2>/dev/null | head -4 || true
            else
              echo "NOTE $p 不在 feeds 源码树（包名可能由 luci.mk 生成；现网 apk 源已实测可装）"
            fi
          done
          echo "=== sing-box 构建标签（Hysteria2 需要 with_quic）==="
          SB=$(find feeds package -maxdepth 6 -type d -name sing-box -print -quit 2>/dev/null)
          if [ -n "$SB" ]; then
            grep -n 'GO_PKG_TAGS' "$SB/Makefile" || true
          else
            echo "::warning::feeds 里没有 sing-box，刷机后 apk add sing-box 可能不可用"
          fi

      - name: 写入 .config 并断言机型与必编包
        run: |
          cp "$GITHUB_WORKSPACE/config.seed" "$GITHUB_WORKSPACE/libwrt/.config"
          cd "$GITHUB_WORKSPACE/libwrt"
          make defconfig
          echo "=== 已选中的设备符号（必须只有 AX3600 stock）==="
          grep -E '^CONFIG_TARGET.*DEVICE.*=y|^CONFIG_TARGET_PROFILE' .config || true
          echo "=== 关键包复核 ==="
          grep -E 'CONFIG_PACKAGE_(adguardhome|smartdns|luci-theme-vantage|luci-app-(adguardhome|smartdns|vantage))=' .config || true
          echo "=== 断言 1：目标设备确实是 xiaomi_ax3600-stock ==="
          if ! grep -Eq '^CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600[-_]stock=y' .config; then
            echo "::error::目标设备符号未生效，会编成别的机型（第一次就栽在这里），立即终止"
            echo ">>> 请把上面「已选中的设备符号」里的实际名字告诉我，改 config.seed 对应行即可"
            exit 1
          fi
          echo "=== 断言 2：必编包确实进了 .config ==="
          miss=0
          for s in CONFIG_PACKAGE_adguardhome=y CONFIG_PACKAGE_smartdns=y \
                   CONFIG_PACKAGE_luci-theme-vantage=y CONFIG_PACKAGE_luci-app-passwall=y; do
            if grep -qx "$s" .config; then echo "OK   $s"; else echo "MISS $s"; miss=1; fi
          done
          [ "$miss" -eq 0 ] || { echo "::error::关键包未进入 .config，立即终止"; exit 1; }
          echo "=== 断言 3：Passwall 只编本体，三个大核心不在固件里（用户自己「组件更新」）==="
          echo "--- .config 里与 passwall / 核心相关的行（诊断用）---"
          grep -E 'CONFIG_PACKAGE_(luci-app-passwall|geoview|xray-core|sing-box|hysteria)' .config || echo "(无)"
          echo "--- 透明代理后端（nftables.sh 是否落位由打包决定，这里只看是否被显式选中）---"
          grep -E 'CONFIG_PACKAGE_luci-app-passwall_(Nftables|Iptables)_Transparent_Proxy' .config \
            || echo "(未显式出现；现网镜像 /usr/share/passwall/nftables.sh 已实测存在，不影响功能)"
          for s in CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray \
                   CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox \
                   CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria; do
            if grep -qx "$s=y" .config; then echo "::error::$s 被打开了，会给镜像凭空加核心体积"; exit 1; else echo "OK   $s 未打开"; fi
          done
          # 只硬盯三个大件：xray 29.7MB、sing-box 41.8MB、hysteria 22.2MB。
          # geoview 不列入硬失败：passwall 的 config 段写的是 `default y if aarch64||arm...`，
          # 显式 not set 也压不住（现网镜像同样带一份 7.2MB 的 /usr/bin/geoview）。
          CORE=$(grep -E '^CONFIG_PACKAGE_(xray-core|sing-box|hysteria)=y' .config || true)
          if [ -n "$CORE" ]; then
            echo "::error::大核心仍被选中（可能来自 target 默认包集）：$CORE"; exit 1
          else
            echo "OK   镜像不含 xray-core / sing-box / hysteria"
          fi
          if grep -qx 'CONFIG_PACKAGE_geoview=y' .config; then
            echo "NOTE geoview=y —— passwall 在 aarch64 上的默认项（7.2MB，现网同款），不拦"
          fi
          echo "=== 断言 4：不应再出现第二套代理前端（Passwall 已定稿，其余不编）==="
          # luci-app-passwall / xray-core / sing-box / luci-compat / unzip 已由我们的
          # 「Passwall」段主动选中，这里只盯"别的代理前端"和 ruby（会白吃体积）。
          PROXY=$(grep -E '^CONFIG_PACKAGE_(luci-app-(openclash|homeproxy|nikki)|mihomo|ruby|ruby-yaml|dnsmasq_full_nftset)=y' .config || true)
          if [ -n "$PROXY" ]; then
            echo "::warning::以下代理相关包被选中，请确认是否 target 默认带入：$PROXY"
          else
            echo "OK   固件不含 openclash / homeproxy / nikki / mihomo / ruby"
          fi
          echo "=== 后续 apk 安装所需的 kmod 是否都已编入（这些无法在线安装）==="
          kmiss=0
          for p in kmod-tun kmod-inet-diag kmod-netlink-diag kmod-nft-tproxy kmod-nft-socket; do
            if grep -qx "CONFIG_PACKAGE_$p=y" .config; then echo "OK   $p"; else echo "MISS $p"; kmiss=1; fi
          done
          [ "$kmiss" -eq 0 ] || echo "::warning::上述 kmod 缺失会让刷机后 apk add sing-box / luci-app-homeproxy 失败或功能不全"
          echo "=== WireGuard 复核（应为空）==="
          WG=$(grep -E '^CONFIG_PACKAGE_(wireguard-tools|kmod-wireguard|luci-proto-wireguard)=y' .config || true)
          if [ -n "$WG" ]; then
            echo "::warning::WireGuard 仍被选中，可能是 target 默认包集带入：$WG"
          else
            echo "OK   WireGuard 三个包均未选中"
          fi
          echo "=== 附加 kmod 生效报告（MISS = 源码无此包或被 target 排除，已跳过，不影响编译）==="
          grep -E '^CONFIG_PACKAGE_kmod-' "$GITHUB_WORKSPACE/config.seed" \
            | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | while read -r p; do
              if grep -qx "CONFIG_PACKAGE_$p=y" .config; then
                echo "OK   $p"
              else
                echo "MISS $p"
              fi
            done
          echo "=== 最终编入固件的全部 kmod ==="
          grep -E '^CONFIG_PACKAGE_kmod-.*=y' .config | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | sort
          echo "=== 其它 CONFIG_PACKAGE_* 核对（MISS 仅提示：本分支无此包或被 target 排除，不影响编译）==="
          grep -E '^CONFIG_PACKAGE_' "$GITHUB_WORKSPACE/config.seed" \
            | grep -v '^CONFIG_PACKAGE_kmod-' | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | while read -r p; do
              grep -qx "CONFIG_PACKAGE_$p=y" .config || echo "MISS $p"
            done
          echo "=== 上面若出现 MISS，说明 config.seed 里请求了本分支不存在的包，需要从 config.seed 删掉 ==="

      - name: 断言 1G 内存档位（NSS Memory Profile = HIGH）
        run: |
          cd "$GITHUB_WORKSPACE/libwrt"
          echo "=== NSS 内存档位（nss_packages: qca-nss-drv/Config.in）==="
          grep -E '^CONFIG_NSS_MEM_PROFILE' .config || true
          if grep -qx 'CONFIG_NSS_MEM_PROFILE_HIGH=y' .config; then
            echo "OK   NSS_MEM_PROFILE_HIGH（1G 档）已生效"
          elif grep -qE '^CONFIG_NSS_MEM_PROFILE_' .config; then
            echo "::error::NSS 内存档位不是 1G（HIGH）。1G 内存会被当成 512M 板子编，"
            echo "::error::NSS 缓冲池只按一半内存分配，高并发时更容易丢包。"
            echo ">>> 检查 config.seed 里 CONFIG_NSS_MEM_PROFILE_HIGH=y 是否被 defconfig 丢弃。"
            exit 1
          else
            echo "::warning::.config 里没有 NSS_MEM_PROFILE 符号："
            echo "::warning::多半是 nss_packages feed 没装上、或 kmod-qca-nss-drv 未被选中。"
            echo "::warning::下一步「核对固件 kmod 基线」会检查 kmod-qca-nss-drv，缺了会直接失败。"
          fi
          echo "=== 1G 内存怎么生效的（供事后排查）==="
          echo "CDT(/dev/mtd5) 配 DDR 容量 + bootloader 修正 dtb 的 /memory 节点；"
          echo "固件源码保留 ipq8074-512m.dtsi 的保留区布局即可，不改 memory reg、不做 1g dtsi。"
          echo "ath11k 的 qcom,ath11k-fw-memory-mode 保持 <1>（512M 档）：改成 0 需同步把 q6"
          echo "保留区从 55MB 放大到约 97MB，属高风险改动，本仓库不做。"

      - name: 确认 Vantage 自带「设为默认主题」脚本（argon 已移除，不再由我们写 mediaurlbase）
        run: |
          F="$GITHUB_WORKSPACE/libwrt/feeds/vantage/luci-theme-vantage/root/etc/uci-defaults/30_luci-theme-vantage"
          if [ -f "$F" ]; then
            echo "OK   Vantage 自带 uci-defaults：$F"
            grep -nE 'luci.themes.Vantage|mediaurlbase|PKG_UPGRADE' "$F" || true
            sh -n "$F" && echo "OK   sh -n 通过"
          else
            echo "::warning::没找到 Vantage 的 30_luci-theme-vantage，刷机后默认主题可能仍是 Bootstrap"
            echo "::warning::如出现该情况，在 LuCI「系统 → 语言与界面」里手动切到 Vantage 即可"
          fi

      # 5G 的 disassoc_low_ack 按 OpenWrt 默认（=1）交给驱动判断，不再用 uci-defaults 改。
      # 2026-11-19 用户决定：低 ACK 踢人保持默认行为，固件里不预置任何 wireless 覆盖。
      - name: 预下载源码包
        working-directory: libwrt
        run: make download -j8

      - name: 编译固件
        working-directory: libwrt
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "完整编译日志写入 build.log（V=s 日志可达数百 MB，不直出 Actions 日志）"
          echo "=== 编译前环境 ==="
          echo "cores=$(nproc)  mem=$(free -g | awk '/^Mem:/{print $2}')GB"
          df -h / "$GITHUB_WORKSPACE" | sed 's/^/  /'
          FREE_G=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "可用磁盘 ${FREE_G}GB（OpenWrt 首次编译约需 22-28GB）"
          if [ "$FREE_G" -lt 20 ]; then
            echo "::warning::可用磁盘只有 ${FREE_G}GB，很可能编到一半 ENOSPC 被杀"
          fi
          set +e
          make -j$(nproc) V=s > "$LOG" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "=== 编译失败 rc=$rc（137=SIGKILL/内存或磁盘；143=SIGTERM/被取消；1=真编译错误）==="
            echo "=== 失败瞬间资源 ==="
            df -h / | sed 's/^/  /'
            free -m | sed 's/^/  /'
            echo "=== 内核 OOM / 杀进程记录 ==="
            (dmesg 2>/dev/null || sudo dmesg 2>/dev/null) | grep -iE 'killed process|out of memory|oom-kill' | tail -8 || echo "  (dmesg 无 OOM 记录)"
            echo "=== build.log 状态 ==="
            ls -lh "$LOG"; echo "  行数: $(wc -l < "$LOG")"
            echo "=== 日志最后 5 行（看是否被硬截断）==="
            tail -n 5 "$LOG" | cut -c1-200
            echo "=== 若 rc≠1 且日志末尾没有 '*** Error'，说明不是编译错，是进程被外部杀掉（内存/磁盘/取消）==="
            echo "=== 最后 300 行 ==="
            tail -n 300 "$LOG"
            echo "=== error / fatal 相关行（最后 40 条）==="
            grep -inE '\b(error|fatal|failed)\b' "$LOG" | tail -40 || true
            exit "$rc"
          fi
          echo "=== 编译成功，最后 80 行 ==="
          tail -n 80 "$LOG"

      - name: 压缩编译日志（成功/失败都保留）
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            gzip -9 -c "$GITHUB_WORKSPACE/build.log" > "$GITHUB_WORKSPACE/build.log.gz"
            ls -lh "$GITHUB_WORKSPACE/build.log.gz"
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: 整理产物并断言固件真的存在
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          B="$GITHUB_WORKSPACE/libwrt/bin/targets/qualcommax/ipq807x"
          echo "=== bin/targets/qualcommax/ipq807x 内容 ==="
          ls -lh "$B" | head -60
          echo "=== 所有镜像文件 ==="
          find "$B" -maxdepth 1 -type f \( -name '*.bin' -o -name '*.ubi' -o -name '*.manifest' \) \
            -printf '%f (%s bytes)\n' | sort
          echo "=== manifest 复核：关键 kmod / WireGuard / 是否混入代理应用 ==="
          grep -iE 'kmod-(tun|inet-diag|netlink-diag|nft-tproxy|nft-socket)|wireguard|openclash|homeproxy|sing-box|ruby' "$B"/*.manifest \
            || echo '(manifest 无匹配，请回看上方 MISS 报告)'
          echo "=== 固件里应只有 Passwall 本体，无第二套代理前端、无协议核心大件 ==="
          if grep -iE '^(luci-app-(openclash|homeproxy|nikki)|mihomo|ruby|ruby-yaml|xray-core|sing-box|hysteria|geoview) ' "$B"/*.manifest; then
            echo "::warning::固件里出现了第二套代理前端或协议核心，请检查 target 默认包集"
          else
            echo "OK   只有 luci-app-passwall + 它的轻量依赖，核心留给「组件更新」"
          fi
          FW=$(find "$B" -maxdepth 1 -type f \
            -name '*xiaomi_ax3600-stock*squashfs-sysupgrade*.bin' -print -quit)
          if [ -z "$FW" ]; then
            echo "::error::没找到 xiaomi_ax3600-stock 的 sysupgrade.bin —— 机型不对或镜像未生成，拒绝产出空 artifact"
            exit 1
          fi
          echo "FIRMWARE_OK: $FW"
          cp "$B"/*xiaomi_ax3600* "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp "$B"/*.manifest "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/out/"
          {
            echo "### 代理（只编 Passwall 本体，核心自己更新）"
            echo "- 本镜像内置：luci-app-passwall 26.11.11 + luci-i18n-passwall-zh-cn，"
            echo "  及其硬依赖 chinadns-ng / dns2socks / microsocks / tcping / ipt2socks / dnsmasq-full。"
            echo "- 协议核心（xray / sing-box / hysteria / geoview）【不编】：体积太大，"
            echo "  刷完进 Passwall「组件更新」→ 检查更新，自己装/更新到 /usr/bin。"
            echo "- 透明代理按 nftables(fw4) 编译，Iptables 侧未编。"
            echo "- Geo 数据没编：进「规则管理」点一次更新即可。"
            echo "- 现有 51 个节点配置在 /etc/config/passwall，sysupgrade 会保留；"
            echo "  但核心目录若被覆盖，刷完要先点一次「组件更新」才有可用核心。"
            echo "- 这是 DNS 旁路由：勿开 TUN / 全局透明代理 / 内置 DNS 抢 :53，"
            echo "  会打断 AGH :53 -> SmartDNS :6053 的链路。"
            echo ""
            echo "### 1G 内存（本机硬件已改 1G）"
            echo "- 编译侧只锁了 NSS Memory Profile = HIGH（1G 档），已由上面的断言步骤把关。"
            echo "- 内存识别靠 CDT(mtd5) + bootloader 修正 /memory 节点，与固件无关；"
            echo "  刷完用 \`head -3 /proc/meminfo\` 复核，MemTotal 应约 927000 kB。"
            echo "- ath11k 固件内存档位没动（仍 512M 档），原因见 config.seed 注释。"
            echo ""
            echo "### 5G 低 ACK 踢人：保持默认"
            echo "- 不再内置 uci-defaults 覆盖，disassoc_low_ack 走 OpenWrt 默认值。"
            echo "- 若以后又出现设备反复断-连（hostapd 报 excessive missing ACKs），手动补："
            echo "  uci set wireless.default_radio1.disassoc_low_ack=0 && uci commit wireless && wifi reload"
            echo ""
            echo "### 刷机后还会保留什么、会丢什么"
            echo "- sysupgrade 只搬 /etc 侧：/etc/config、/etc/passwall、/etc/sysupgrade.conf 白名单。"
            echo "- 丢的是 /usr 侧后装程序与 apk 数据库 —— 所以后装的插件每次刷机都要重装。"
            echo "- 本镜像已把 passwall / vantage 都编进 squashfs，不再依赖 overlay。"
            echo "- 仍然【不要加 -n / 不要恢复出厂】：那样连 /etc/config/passwall 也会清空。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 先上传固件再做后续核对：核对断言失败时不能把已经编好的固件一起吞掉。
      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: libwrt-ax3600-stock-${{ inputs.branch }}
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: 核对固件 kmod 与现网基线（刷机后能力不丢）
        if: success()
        run: |
          B="$GITHUB_WORKSPACE/libwrt/bin/targets/qualcommax/ipq807x"
          M=$(ls "$B"/*.manifest 2>/dev/null | head -1)
          [ -n "$M" ] || { echo "::error::没有 manifest，无法核对 kmod"; exit 1; }
          echo "使用 manifest: $M"
          # 基线取自实机 apk list --installed（2026-11-18），只列与能力相关的 kmod：
          # 隧道 / 诊断 / nft 扩展 / QoS / NSS 卸载 / 无线。缺任何一个都会让现网功能退化。
          BASE='kmod-tun
          kmod-inet-diag
          kmod-netlink-diag
          kmod-unix-diag
          kmod-packet-diag
          kmod-nft-tproxy
          kmod-nft-socket
          kmod-nft-fullcone
          kmod-nft-offload
          kmod-sched-cake
          kmod-sched-core
          kmod-tcp-bbr
          kmod-ifb
          kmod-nss-ifb
          kmod-qca-nss-drv
          kmod-qca-nss-ecm
          kmod-qca-nss-dp
          kmod-qca-ssdk
          kmod-ath11k
          kmod-ath11k-ahb
          kmod-mac80211'
          miss=0
          # apk 构建的 manifest 里包名带版本（kmod-xxx-6.12.112.6.18.55-r1），
          # 也可能写成 "名字 版本" / "名字=版本"。先按边界剥掉版本，再做全名精确比对，
          # 避免 kmod-ath11k 被 kmod-ath11k-ahb 误判为已存在。
          echo "=== manifest 格式取证（前 6 行）==="
          head -n 6 "$M" | cut -c1-120
          CLEAN=$(sed -E 's/[[:space:]=:].*$//; s/-[0-9][0-9A-Za-z.+~_-]*$//' "$M" | sort -u)
          echo "  剥版本后共 $(printf '%s\n' "$CLEAN" | grep -c . ) 个包"
          for p in $BASE; do
            if printf '%s\n' "$CLEAN" | grep -qx -- "$p"; then
              echo "OK   $p"
            else
              echo "MISS $p"
              miss=1
            fi
          done
          if [ "$miss" -ne 0 ]; then
            echo "=== 名字相近的候选行（判断是否只是格式差异）==="
            printf '%s\n' "$CLEAN" | grep -E '^(kmod-(nss|ath11k|mac80211|nft|sched|tcp|ifb|tun))' | head -20 || true
            echo "::error::上面 MISS 的 kmod 不在固件里。现网这些是内置的，"
            echo "::error::缺了会影响 Passwall / SQM / NSS 卸载 / WiFi 卸载，刷了会退化。"
            exit 1
          fi
          echo "OK   基线 kmod 全部在固件内"
